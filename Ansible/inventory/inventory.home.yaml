all:
    children:
        k3s:
            vars:
                ansible_user: kubeops
                ansible_ssh_private_key_file: ~/.ssh/kubeops_ed25519
            children:
                k3s_control:
                    hosts:
                        cp-1:
                            ansible_host: 192.168.0.11
                k3s_workers:
                    hosts:
                        worker-1:
                            ansible_host: 192.168.0.12
                        worker-2:
                            ansible_host: 192.168.0.13
                        worker-3:
                            ansible_host: 192.168.0.14
